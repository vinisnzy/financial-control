spring.application.name=financial-control-api
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
security.jwt.token.secret_key=${JWT_SECRET}
security.jwt.access-token.minutes=${ACCESS_TOKEN_EXPIRES_IN_MINUTES}
security.jwt.refresh-token.days=${REFRESH_TOKEN_EXPIRES_IN_DAYS}
springdoc.swagger-ui.path=/docs
