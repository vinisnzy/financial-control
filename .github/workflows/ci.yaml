name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Config Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Unit tests
        run: ./mvnw -B test -DexcludedGroups=integration

      - name: Integration tests
        run: ./mvnw -B verify -Dgroups=integration
